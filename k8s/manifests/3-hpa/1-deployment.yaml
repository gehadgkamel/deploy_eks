---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: hpa
spec:
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: gehadgkamel/end-to-end-todo-app
        ports:
          - containerPort: 8080
            name: http
        resources:
          requests:
            memory: 128MiMi
            cpu: 100m
          limits:
            memory: 128Mi
            cpu: 100m
